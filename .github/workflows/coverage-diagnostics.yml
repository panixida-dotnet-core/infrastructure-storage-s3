name: Coverage diagnostics

on:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dotnet-coverage-sonarqube
          path: coverage
          run-id: 44563330872
          github-token: ${{ github.token }}
      - name: List uncovered coverage branches
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage/SonarQube.xml").getroot()
          for file in root.findall("file"):
              for line in file.findall("lineToCover"):
                  total = int(line.attrib.get("branchesToCover", 0))
                  covered = int(line.attrib.get("coveredBranches", 0))
                  if line.attrib.get("covered") == "false" or total > covered:
                      print(file.attrib["path"], line.attrib)
          PY
